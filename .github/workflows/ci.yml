name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DEDSECAI_HOME: ${{ github.workspace }}/.dedsecai-test-data
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build portable archives and DEB
        run: python build.py
      - name: Validate PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem installers -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $problems = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$problems) | Out-Null
            if ($problems.Count -gt 0) { throw ($problems | Out-String) }
          }
